name: Dependency review

on:
  pull_request:

concurrency:
  group: deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # actions/dependency-review-action needs GitHub's Dependency graph, which
      # is disabled for this repository, so it fails with "Dependency review is
      # not supported on this repository". npm audit checks the dependencies
      # that ship in the bundle against the npm advisory database instead.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
